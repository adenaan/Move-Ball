<!DOCTYPE html>
<html>
<head>
    <title>Web</title>
</head>
<body>
    <div id="linksContainer"></div>
    <iframe id="videoPlayer" width="560" height="315" src="" frameborder="0"></iframe>

    <script>
        fetch('https://m.skorkilat3.com/#/pages/live/index')
            .then(response => response.text())
            .then(data => {
                const urls = data.match(/https?:\/\/[\w\-]+(\.[\w\-]+)+([\w\.,@?^=%&:/~\+#-]*[\w@?^=%&/~\+#-])?/g);
                const linksContainer = document.getElementById('linksContainer');

                urls.forEach(url => {
                    const link = document.createElement('a');
                    link.href = url;
                    link.textContent = url;
                    link.onclick = function() {
                        document.getElementById('videoPlayer').src = url;
                    };

                    const thumbnail = document.createElement('img');
                    thumbnail.src = 'https://www.example.com/thumbnail.jpg';

                    linksContainer.appendChild(link);
                    linksContainer.appendChild(thumbnail);
                    linksContainer.appendChild(document.createElement('br'));
                });
            })
            .catch(error => console.error(error));
    </script>
</body>
</html>
